name: Work order tests

on:
  push:
    branches: [feature/work-order-change-resend]
  pull_request:
    paths:
      - 'erp/**'
      - 'mes/**'
      - '.github/workflows/work-order-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        application: [erp, mes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit and API integration tests
        working-directory: ${{ matrix.application }}
        run: bash gradlew test --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.application }}
          path: |
            ${{ matrix.application }}/build/reports/tests/test
            ${{ matrix.application }}/build/test-results/test
          if-no-files-found: ignore
