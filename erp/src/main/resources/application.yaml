spring:
  application:
    name: erp

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=factoryflow_erp;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${ERP_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

mes:
  api:
    base-url: http://localhost:8081